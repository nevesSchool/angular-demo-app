<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title class="ion-text-center">Sign In</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding ion-text-center">
  <ion-grid>
    <ion-row>
      <ion-col>
        <ion-item>
          <ion-input placeholder="Email" type="email" required></ion-input>
        </ion-item>

        <ion-item>
          <ion-input placeholder="Password" type="password" required></ion-input>
        </ion-item>

        <ion-button>Sign In</ion-button>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
